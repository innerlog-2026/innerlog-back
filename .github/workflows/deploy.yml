# 백엔드 CI/CD
#
# 흐름: develop→main 머지(=main push) ──▶ [build-and-push] Docker Hub ──▶ [deploy] EC2에서 compose pull + up
# ─────────────────────────────────────────────────────────────────────────

name: Deploy Backend

on:
  push:
    branches: [main]
  # Actions 탭의 "Run workflow" 버튼으로 코드 변경 없이 수동 재배포도 가능하게 열어둠
  workflow_dispatch:

# 최소 권한 — 코드 읽기만 필요
permissions:
  contents: read

# 배포가 겹치지 않도록 직렬화. 진행 중인 배포는 끊지 않는다(반쯤 배포된 상태 방지).
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  IMAGE_NAME: innerlog-backend
  # EC2에서 docker-compose.prod.yml 이 위치한 디렉터리. 실제 경로에 맞게 수정.
  APP_DIR: /home/ubuntu/innerlog

jobs:
  # ── 1) 이미지 빌드 후 Docker Hub 푸시 ──────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 준비
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest(운영에서 pull) + 커밋 SHA(추적/롤백용) 두 태그로 푸시.
      # GitHub Actions 캐시로 pip 레이어를 재사용해 빌드 시간 단축.
      - name: 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2) EC2에 SSH로 접속해 새 이미지로 재기동 ───────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2 배포 (compose pull + up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || '22' }}
          # 서버에서 실행할 명령. private 이미지 대비 docker login 후 backend만 재배포.
          envs: APP_DIR,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            cd "$APP_DIR"
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.prod.yml up -d backend
            docker image prune -f
            docker logout
        env:
          APP_DIR: ${{ env.APP_DIR }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
