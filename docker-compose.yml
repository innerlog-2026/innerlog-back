services:
  db:
    image: postgres:16-alpine
    container_name: innerlog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: innerlog
      POSTGRES_PASSWORD: innerlog1234
      POSTGRES_DB: innerlog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
